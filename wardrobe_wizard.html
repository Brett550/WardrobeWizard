<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wardrobe Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #ffffff;
  --surface: #ffffff;
  --wash: #f2f4f8;
  --ink: #181425;
  --ink-soft: #5a6988;
  --line: #c0cbdc;
  --magic: #b55088;
  --magic-ink: #68386c;
  --spark: #fee761;
  --today: #fff6c2;
  --sky: #0099db;
  --bad: #e43b44;
  --ok: #3e8948;
  --b: 3px;
  --font: "Pixelify Sans", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #262b44;
    --surface: #2f3655;
    --wash: #3a4466;
    --ink: #f2f4f8;
    --ink-soft: #c0cbdc;
    --line: #5a6988;
    --magic: #f6757a;
    --magic-ink: #ffd0d4;
    --spark: #fee761;
    --today: #4a4466;
    --sky: #2ce8f5;
    --bad: #ff6b74;
    --ok: #63c74d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.4; -webkit-font-smoothing: none;
}
img.px-img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--magic); outline-offset: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* notched pixel border + hard shadow */
.px {
  background: var(--surface);
  box-shadow:
    0 calc(var(--b) * -1) 0 0 var(--ink), 0 var(--b) 0 0 var(--ink),
    calc(var(--b) * -1) 0 0 0 var(--ink), var(--b) 0 0 0 var(--ink);
}
.px.lift {
  box-shadow:
    0 calc(var(--b) * -1) 0 0 var(--ink), 0 var(--b) 0 0 var(--ink),
    calc(var(--b) * -1) 0 0 0 var(--ink), var(--b) 0 0 0 var(--ink),
    var(--b) calc(var(--b) * 2) 0 0 var(--ink), calc(var(--b) * 2) var(--b) 0 0 var(--ink);
}
.btn {
  border: 0; cursor: pointer; padding: 8px 14px; margin: var(--b);
  background: var(--surface); display: inline-flex; align-items: center; gap: 8px;
}
.btn:active { transform: translate(2px, 2px); }
.btn.magic { background: var(--magic); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.magic { color: #181425; } }
.link { background: none; border: 0; padding: 4px; cursor: pointer; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 4px; }

/* ---------------- intro ---------------- */
#intro {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper);
  transition: opacity .5s;
}
#intro.gone { opacity: 0; pointer-events: none; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#cloud-wrap { height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
#cloud {
  position: relative; border: 0; background: none; cursor: pointer; padding: 0;
  width: 288px; height: 168px; opacity: 0; transform: scale(.4); transition: opacity .35s, transform .35s cubic-bezier(.3,1.6,.5,1);
}
#cloud.show { opacity: 1; transform: scale(1); }
#cloud img { width: 100%; height: 100%; }
#cloud .label {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  font-weight: 600; font-size: 20px; color: #181425; padding-top: 18px;
}
#cloud .label small { font-weight: 400; font-size: 13px; color: #3a4466; }
#cloud.over { transform: scale(1.06); }
#demo-link { opacity: 0; transition: opacity .3s .2s; }
#demo-link.show { opacity: 1; }
#closet-btn { border: 0; background: none; padding: 0; cursor: pointer; }
#closet-btn img { width: 280px; height: 300px; display: block; }
#closet-btn.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.hint { color: var(--ink-soft); font-size: 15px; min-height: 22px; }
.logo { display: block; }

/* poof particles + flying photos */
.puff { position: fixed; width: 18px; height: 18px; background: #fff; pointer-events: none; z-index: 50;
  box-shadow: 0 -3px 0 0 #181425, 0 3px 0 0 #181425, -3px 0 0 0 #181425, 3px 0 0 0 #181425; }
.fly { position: fixed; width: 64px; height: 64px; object-fit: cover; z-index: 40; pointer-events: none;
  box-shadow: 0 -3px 0 0 #181425, 0 3px 0 0 #181425, -3px 0 0 0 #181425, 3px 0 0 0 #181425; background: #fff; }

/* loader */
#loader { position: fixed; inset: 0; display: none; place-items: center; background: var(--paper); z-index: 60; }
#loader.on { display: grid; }
#loader .box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#loader img { width: 144px; height: 144px; animation: wiggle 1.1s steps(4) infinite; transform-origin: 20% 80%; }
@keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
#loader .title { font-size: 22px; font-weight: 600; }
#loader .count { color: var(--ink-soft); }
.spark { position: fixed; width: 8px; height: 8px; background: var(--spark); pointer-events: none; z-index: 61;
  box-shadow: 0 0 0 2px #181425; animation: spark .9s steps(5) forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---------------- main app ---------------- */
#app { display: none; height: 100%; opacity: 0; transition: opacity .5s; }
#app.on { display: grid; }
#app.show { opacity: 1; }
#app {
  grid-template-columns: 284px minmax(0, 1fr) 104px; grid-template-rows: auto minmax(0, 1fr);
  gap: 20px 24px; padding: 20px 24px;
}
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
header .week { color: var(--ink-soft); font-size: 18px; }
header .grow { flex: 1; }
.mode-pill { font-size: 13px; padding: 4px 10px; margin: var(--b); background: var(--wash); }

.left { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.panel { padding: 14px; margin: var(--b); }
.panel h2 { font-size: 20px; margin: 0; font-weight: 600; }
.panel .sub { color: var(--ink-soft); font-size: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
#closet { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#closet-grid {
  flex: 1; min-height: 120px; overflow: auto; display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; padding: 6px; align-content: start;
}
.tile {
  position: relative; aspect-ratio: 1; display: grid; place-items: center; cursor: grab;
  background: var(--wash); touch-action: none; user-select: none; border: 0; padding: 0;
}
.tile img { width: 64px; height: 64px; pointer-events: none; }
.tile .badge { position: absolute; top: 2px; right: 4px; font-size: 12px; color: var(--magic-ink); font-weight: 600; }
.tile .worn { position: absolute; bottom: 2px; left: 4px; font-size: 12px; color: var(--ink-soft); }
.tile.dirty { opacity: .45; cursor: not-allowed; }
.empty-note { grid-column: 1 / -1; color: var(--ink-soft); font-size: 15px; padding: 8px; }

#hamper { display: flex; align-items: center; gap: 12px; }
#hamper-drop { border: 0; background: none; padding: 0; cursor: pointer; transition: transform .15s; }
#hamper-drop img { width: 112px; height: 112px; display: block; }
#hamper-drop.drop-ok { transform: scale(1.12) rotate(-3deg); }
#hamper-drop.bounce { animation: bounce .4s; }
@keyframes bounce { 30% { transform: scale(1.15, .88); } 60% { transform: scale(.95, 1.06); } }
#hamper .info { display: flex; flex-direction: column; gap: 4px; }
#hamper .count { font-size: 15px; color: var(--ink-soft); }

/* week board */
.board-wrap { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
#board {
  display: grid; grid-template-columns: 70px repeat(7, minmax(84px, 1fr)); gap: 8px;
  min-width: 720px; padding: var(--b);
}
.dayhead { text-align: center; padding: 8px 4px; margin: var(--b); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dayhead.today { background: var(--today); }
.dayhead .name { font-weight: 600; font-size: 17px; }
.dayhead .date { color: var(--ink-soft); font-size: 13px; }
.dayhead .wx { display: flex; align-items: center; gap: 4px; font-size: 14px; }
.dayhead .wx img { width: 32px; height: 32px; }
.lock { border: 0; background: none; cursor: pointer; padding: 2px; opacity: .55; }
.lock[aria-pressed="true"] { opacity: 1; }
.lock img { width: 24px; height: 24px; display: block; }
.rowhead { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--ink-soft); }
.rowhead img { width: 40px; height: 40px; opacity: .8; }
.slot {
  position: relative; height: 84px; display: grid; place-items: center; margin: var(--b);
  background: var(--wash); touch-action: none; user-select: none; cursor: grab; border: 0; padding: 0;
}
.slot img { width: 64px; height: 64px; pointer-events: none; }
.slot.empty { background: transparent; cursor: default;
  box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); }
.slot.empty .plus { color: var(--line); font-size: 26px; }
.slot.nohat { cursor: pointer; background: transparent; color: var(--ink-soft); font-size: 13px;
  box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); }
.slot.nohat img { width: 40px; height: 40px; opacity: .5; }
.slot .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border: 0; padding: 0; cursor: pointer;
  background: var(--surface); font-size: 14px; line-height: 1; display: none;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); }
.slot:hover .x, .slot:focus-within .x { display: block; }
.slot.fresh { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.12); } }
.drop-ok { outline: 3px solid var(--ok); outline-offset: 3px; }
.drop-no { outline: 3px solid var(--bad); outline-offset: 3px; }
#notes { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; margin: var(--b); max-width: 70ch; }
#notes p { margin: 0; }
#notes .tip { color: var(--magic-ink); }

/* tool rail */
.rail { display: flex; flex-direction: column; gap: 14px; }
.tool {
  border: 0; cursor: pointer; padding: 10px 4px 8px; margin: var(--b);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; background: var(--surface);
}
.tool img { width: 32px; height: 32px; }
.tool[aria-expanded="true"] { background: var(--today); }
.tool:active { transform: translate(2px, 2px); }

#tool-panel {
  position: fixed; right: 148px; top: 84px; width: 320px; max-height: calc(100vh - 110px); overflow: auto;
  padding: 16px; z-index: 30; display: none;
}
#tool-panel.on { display: block; }
#tool-panel h2 { margin: 0 0 10px; font-size: 20px; }
#tool-panel .close { position: absolute; top: 10px; right: 10px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 6px 4px; cursor: pointer; }
.opt input { accent-color: var(--magic); width: 18px; height: 18px; }
.wxrow { display: grid; grid-template-columns: 44px 40px 1fr auto; align-items: center; gap: 8px; padding: 4px 0; }
.wxrow img { width: 32px; height: 32px; }
.fine { color: var(--ink-soft); font-size: 13px; margin-top: 10px; }
.seg { display: flex; gap: 4px; margin: 8px 0; }
.seg button { padding: 4px 12px; }
.seg button[aria-pressed="true"] { background: var(--today); }

/* ghost + item sheet + toast */
.ghost { position: fixed; left: 0; top: 0; width: 80px; height: 80px; pointer-events: none; z-index: 100;
  filter: drop-shadow(4px 4px 0 rgba(24, 20, 37, .35)); }
body.dragging, body.dragging * { cursor: grabbing !important; }
dialog { border: 0; padding: 20px; width: min(380px, 92vw); color: var(--ink); }
dialog::backdrop { background: rgba(24, 20, 37, .35); }
.sheet-top { display: flex; gap: 16px; align-items: center; }
.sheet-top img { width: 128px; height: 128px; background: var(--wash); }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
.field input, .field select { padding: 6px 8px; border: 0; background: var(--wash); color: var(--ink); font-size: 16px;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); margin: 2px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.guess { color: var(--magic-ink); font-size: 14px; margin-top: 8px; }
.photo-thumb { width: 56px; height: 56px; object-fit: cover; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  padding: 10px 16px; z-index: 120; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%); }
#hamper-dialog .list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }

@media (max-width: 1000px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; }
  .rail { flex-direction: row; flex-wrap: wrap; order: -1; }
  .left { order: 3; }
  #closet-grid { max-height: 360px; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  #tool-panel { right: 16px; left: 16px; width: auto; top: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<section id="intro" aria-label="Get started">
  <div class="stage">
    <canvas class="logo" id="logo" aria-label="Wardrobe Wizard" role="img"></canvas>
    <div id="cloud-wrap">
      <button id="cloud" tabindex="-1" aria-hidden="true">
        <img class="px-img" id="cloud-img" alt="">
        <span class="label">Upload photos<small>Drop them here or click to choose</small></span>
      </button>
      <button class="link" id="demo-link" tabindex="-1" aria-hidden="true">Try a sample closet instead</button>
    </div>
    <button id="closet-btn" aria-label="Open the closet">
      <img class="px-img" id="closet-img" alt="">
    </button>
    <p class="hint" id="hint">Click the closet to open it</p>
  </div>
  <input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
</section>

<section id="loader" aria-live="polite">
  <div class="box">
    <img class="px-img" id="wand-img" alt="">
    <div class="title" id="loader-title">Turning photos into pixels</div>
    <div class="count" id="loader-count"></div>
  </div>
</section>

<!-- ============ MAIN ============ -->
<main id="app" aria-label="Wardrobe Wizard">
  <header>
    <canvas id="logo-small" role="img" aria-label="Wardrobe Wizard"></canvas>
    <span class="week" id="week-label"></span>
    <span class="grow"></span>
    <span class="mode-pill px" id="mode-pill"></span>
  </header>

  <div class="left">
    <section class="panel px lift" id="closet" aria-labelledby="closet-h">
      <div class="panel-head">
        <h2 id="closet-h">Closet</h2>
        <span class="sub" id="closet-count"></span>
      </div>
      <div class="sub" id="closet-filter-note" hidden></div>
      <div id="closet-grid" data-drop="closet"></div>
    </section>
    <section class="panel px lift" id="hamper" aria-label="Laundry hamper">
      <button id="hamper-drop" data-drop="hamper" aria-label="Open the hamper">
        <img class="px-img" id="hamper-img" alt="">
      </button>
      <div class="info">
        <h2>Hamper</h2>
        <span class="count" id="hamper-count"></span>
        <button class="btn px" id="wash-btn">Wash all</button>
      </div>
    </section>
  </div>

  <section class="board-wrap" aria-label="This week's outfits">
    <div id="board"></div>
    <div id="notes" class="px" aria-live="polite"></div>
  </section>

  <nav class="rail" aria-label="Tools">
    <button class="tool px lift" data-tool="weather" aria-expanded="false"><img class="px-img" alt="">Weather</button>
    <button class="tool px lift" data-tool="style" aria-expanded="false"><img class="px-img" alt="">Style</button>
    <button class="tool px lift" data-tool="plan"><img class="px-img" alt="">Plan week</button>
    <button class="tool px lift" data-tool="filter" aria-expanded="false"><img class="px-img" alt="">Filter</button>
    <button class="tool px lift" data-tool="sort" aria-expanded="false"><img class="px-img" alt="">Sort</button>
    <button class="tool px lift" data-tool="add"><img class="px-img" alt="">Add clothes</button>
  </nav>
</main>

<aside id="tool-panel" class="px lift" aria-live="polite"></aside>

<dialog id="sheet" class="px lift"></dialog>
<dialog id="hamper-dialog" class="px lift"></dialog>
<div id="toast" class="px lift" role="status"></div>

<script>
/* =====================================================================
   Wardrobe Wizard prototype
   - Sprites come from a JS port of the Python renderer (same templates + palette).
   - Open with ?api=http://localhost:8000 to send uploads to the FastAPI /sprites backend.
     Without it, uploads run in demo mode: colors are read in the browser, types are guessed.
   ===================================================================== */
const API_BASE = new URLSearchParams(location.search).get('api') || '';

/* ---------------- palette + color math (port of palette.py) ---------------- */
const PAL = ["#be4a2f","#d77643","#ead4aa","#e4a672","#b86f50","#733e39","#3e2731","#a22633",
  "#e43b44","#f77622","#feae34","#fee761","#63c74d","#3e8948","#265c42","#193c3e",
  "#124e89","#0099db","#2ce8f5","#ffffff","#c0cbdc","#8b9bb4","#5a6988","#3a4466",
  "#262b44","#181425","#ff0044","#68386c","#b55088","#f6757a","#e8b796","#c28569",
  "#2f3820","#4b5a2a","#6f7d3c","#9aa25a","#b9a77c","#d9c9a3","#8c7a5b",
  "#1e1e1e","#3a3a3a","#5e5e5e","#8a8a8a","#b4b4b4","#dcdcdc","#2b3f63","#4a6a9c","#1f2a52",
  "#5b2333","#7a2e3a"];
const hexToRgb = h => { h = h.replace('#',''); if (h.length === 3) h = [...h].map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgbToHex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function lab([r, g, b]) {
  const f = v => { v /= 255; return v > 0.04045 ? ((v + 0.055) / 1.055) ** 2.4 : v / 12.92; };
  const R = f(r), G = f(g), B = f(b);
  let x = (0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047, y = 0.2126 * R + 0.7152 * G + 0.0722 * B,
      z = (0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883;
  const t = v => v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116;
  x = t(x); y = t(y); z = t(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
const PAL_LAB = PAL.map(h => lab(hexToRgb(h)));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const L = h => lab(hexToRgb(h))[0];
function nearest(hex, opt = {}) {
  const t = lab(hexToRgb(hex));
  const order = PAL_LAB.map((l, i) => [dist(l, t), i]).sort((a, b) => a[0] - b[0]);
  for (const [, i] of order) {
    const li = PAL_LAB[i][0];
    if (opt.darker && li >= L(opt.darker) - 3) continue;
    if (opt.lighter && li <= L(opt.lighter) + 3) continue;
    return PAL[i];
  }
  return PAL[order[0][1]];
}
function hsv(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [((h / 6) + 1) % 1, mx ? d / mx : 0, mx];
}
function fromHsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  const [r, g, b] = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][((i % 6) + 6) % 6];
  return rgbToHex([r * 255, g * 255, b * 255]);
}
const shift = (hex, dh, ds, dv) => { const [h, s, v] = hsv(hex);
  return fromHsv((h + dh + 1) % 1, Math.max(0, Math.min(1, s + ds)), Math.max(0, Math.min(1, v * dv))); };
const rampCache = new Map();
function ramp(base) {
  base = base.toLowerCase();
  if (rampCache.has(base)) return rampCache.get(base);
  const b = nearest(base);
  const shade = nearest(shift(base, .025, .10, .70), { darker: b });
  const light = L(base) > 92 ? b : nearest(shift(base, -.02, -.08, 1.18), { lighter: b });

function setupWeek() {
  const now = new Date(), monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0, 0, 0, 0);
  state.days = Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
  state.today = (now.getDay() + 6) % 7;
  state.forecast = getForecast(state.days);
  state.plan = state.days.map((d, i) => ({ hat: null, top: null, bottom: null, underwear: null, socks: null, shoes: null,
    hatOn: state.forecast[i].cond === 'sun' || state.forecast[i].hi < 50, locked: false }));
  const fmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
  $('#week-label').textContent = `Week of ${fmt.format(monday)}`;
}
// Swap this for a real weather API call.
function getForecast(days) {
  const conds = ['sun', 'partly', 'cloud', 'rain', 'partly', 'sun', 'cloud'], his = [64, 58, 51, 46, 55, 67, 60];
  return days.map((d, i) => ({ cond: conds[i], hi: his[i], lo: his[i] - 12 }));
}
const COND_LABEL = { sun: 'Sunny', partly: 'Partly cloudy', cloud: 'Cloudy', rain: 'Rain' };
const temp = f => state.unit === 'F' ? `${f}°` : `${Math.round((f - 32) * 5 / 9)}°`;

/* ---------------- planner ---------------- */
const VIBES = { comfy: { label: 'Comfy', tags: ['cozy', 'comfy', 'lounge'] }, campus: { label: 'Campus', tags: ['campus', 'streetwear', 'basic'] },
  sporty: { label: 'Sporty', tags: ['sporty', 'athletic'] }, dressy: { label: 'Dressed up', tags: ['dressy'] } };
const targetWarmth = t => t < 45 ? 5 : t < 54 ? 4 : t < 64 ? 3 : t < 74 ? 2 : 1;
const byId = id => state.items.find(i => i.id === id);
const clean = cat => state.items.filter(i => i.cat === cat && i.status === 'clean');

function scoreItem(item, day, used) {
  const f = state.forecast[day], tw = targetWarmth(f.hi), vibe = VIBES[state.vibe];
  let s = Math.random() * .6;
  if (item.cat === 'top') s -= Math.abs(item.warmth - tw) * 1.6;
  if (item.cat === 'bottom') { s -= Math.abs(item.warmth - Math.min(tw, 3)) * 1.2; if (f.hi >= 74 && item.subtype === 'shorts') s += 2; if (f.hi < 60 && item.subtype === 'shorts') s -= 4; }
  s += item.tags.filter(t => vibe.tags.includes(t)).length * 1.2;
  if (state.vibe === 'dressy') s += (item.formality - 2) * .8;
  const sat = hsv(item.primary)[1];
  if (state.mood === 'bold') s += sat * 1.5; if (state.mood === 'calm') s -= sat * 1.5;
  const n = used.get(item.id) || 0;
  s -= n * (['underwear', 'socks'].includes(item.cat) ? 6 : 2.5);
  return s;
}
function planWeek({ only } = {}) {
  const used = new Map();
  const count = id => id && used.set(id, (used.get(id) || 0) + 1);
  state.plan.forEach((p, d) => { if (p.locked || (only && !only.has(d))) CATS.forEach(c => count(p[c])); });
  state.plan.forEach((p, d) => {
    if (p.locked || (only && !only.has(d))) return;
    CATS.forEach(cat => {
      if (cat === 'hat' && !p.hatOn) { p.hat = null; return; }
      const pool = clean(cat);
      if (!pool.length) { p[cat] = null; return; }
      const best = pool.map(it => [scoreItem(it, d, used), it]).sort((a, b) => b[0] - a[0])[0][1];
      p[cat] = best.id; count(best.id);
    });
  });
}
function refillSlots(removedId) {
  const used = new Map();
  state.plan.forEach(p => CATS.forEach(c => p[c] && used.set(p[c], (used.get(p[c]) || 0) + 1)));
  const changed = [];
  state.plan.forEach((p, d) => CATS.forEach(cat => {
    if (p[cat] !== removedId) return;
    p[cat] = null;
    const pool = clean(cat);
    if (pool.length) { const best = pool.map(it => [scoreItem(it, d, used), it]).sort((a, b) => b[0] - a[0])[0][1];
      p[cat] = best.id; used.set(best.id, (used.get(best.id) || 0) + 1); }
    changed.push(d);
  }));
  return changed;
}

/* ---------------- drag and drop (pointer-based, works for mouse + touch) ---------------- */
function draggable(el, itemId, from) {
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null;
    el.setPointerCapture(e.pointerId);
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
        ghost = document.createElement('img'); ghost.className = 'ghost px-img'; ghost.src = byId(itemId).sprite;
        document.body.appendChild(ghost); document.body.classList.add('dragging'); closePanel();
      }
      if (ghost) { ghost.style.transform = `translate(${ev.clientX - 40}px, ${ev.clientY - 40}px)`; hover(ev.clientX, ev.clientY, itemId, from); }
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      if (ghost) { ghost.remove(); document.body.classList.remove('dragging');
        const t = targetAt(ev.clientX, ev.clientY); clearHover(); if (ev.type === 'pointerup') drop(itemId, from, t); }
      else if (ev.type === 'pointerup') openSheet(itemId);
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
const targetAt = (x, y) => document.elementFromPoint(x, y)?.closest('[data-drop]');
let hovered = null;
function canDrop(t, item, from) {
  if (!t) return null;
  if (t.dataset.drop === 'hamper') return true;
  if (t.dataset.drop === 'closet') return from.type === 'slot' || from.type === 'hamper';
  if (t.dataset.drop === 'slot') return item.status === 'clean' && t.dataset.cat === item.cat;
  return null;
}
function hover(x, y, id, from) {
  const t = targetAt(x, y);
  if (hovered && hovered !== t) hovered.classList.remove('drop-ok', 'drop-no');
  hovered = t;
  const ok = canDrop(t, byId(id), from);
  if (t && ok !== null) { t.classList.toggle('drop-ok', ok); t.classList.toggle('drop-no', !ok); }
}
function clearHover() { document.querySelectorAll('.drop-ok,.drop-no').forEach(e => e.classList.remove('drop-ok', 'drop-no')); hovered = null; }
function drop(id, from, t) {
  const item = byId(id);
  const ok = canDrop(t, item, from);
  if (!t || ok === null) return;
  if (!ok) { toast(t.dataset.drop === 'slot' ? `${item.name} goes in the ${CAT_LABEL[item.cat].toLowerCase()} row.` : 'Can’t drop that there.'); return; }
  if (t.dataset.drop === 'hamper') return sendToLaundry(id);
  if (t.dataset.drop === 'closet') {
    if (from.type === 'hamper') return wash([id]);
    state.plan[from.day][from.cat] = null; if (from.cat === 'hat') state.plan[from.day].hatOn = false;
    renderAll(); return toast(`Took ${item.name} off ${LONG_DAYS[from.day]}.`);
  }
  const d = +t.dataset.day, cat = t.dataset.cat, p = state.plan[d];
  if (from.type === 'slot') { const prev = p[cat]; state.plan[from.day][from.cat] = prev; if (from.cat === 'hat' && !prev) state.plan[from.day].hatOn = false; }
  p[cat] = id; if (cat === 'hat') p.hatOn = true;
  fresh.add(`${d}:${cat}`); renderAll();
  toast(`${item.name} is set for ${LONG_DAYS[d]}.`);
}
function sendToLaundry(id) {
  const item = byId(id); item.status = 'laundry';
  const changed = refillSlots(id);
  changed.forEach(d => CATS.forEach(c => fresh.add(`${d}:${c}`)));
  renderAll();
  const h = $('#hamper-drop'); h.classList.remove('bounce'); void h.offsetWidth; h.classList.add('bounce');
  toast(changed.length ? `${item.name} went in the hamper. Swapped it on ${changed.map(d => DAY_NAMES[d]).join(', ')}.` : `${item.name} went in the hamper.`);
}

  dlg.innerHTML = `<h2 style="margin:0;font-size:20px">In the hamper</h2>
    <p class="sub" style="margin:6px 0 0">${dirty.length ? 'Drag an item out onto the closet to wash just that one.' : 'Nothing to wash.'}</p>
    <div class="list">${dirty.map(i => `<div class="tile px" data-id="${i.id}" title="${esc(i.name)}"><img class="px-img" src="${i.sprite}" alt="${esc(i.name)}"></div>`).join('')}</div>
    <div class="sheet-actions">${dirty.length ? '<button class="btn px magic" id="h-wash">Wash all</button>' : ''}<button class="btn px" id="h-close">Close</button></div>`;
  dlg.showModal();
  dlg.querySelectorAll('.tile').forEach(t => {
    const id = t.dataset.id;
    t.addEventListener('pointerdown', () => setTimeout(() => dlg.close(), 0), { once: true });
    draggable(t, id, { type: 'hamper' });
  });
  $('#h-close').onclick = () => dlg.close();
  const hw = $('#h-wash'); if (hw) hw.onclick = () => { dlg.close(); wash(dirty.map(i => i.id)); };
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- tool rail ---------------- */
let openTool = null;
function closePanel() { $('#tool-panel').classList.remove('on'); document.querySelectorAll('.tool[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); openTool = null; }
function showPanel(tool) {
  const panel = $('#tool-panel');
  if (openTool === tool) return closePanel();
  closePanel(); openTool = tool;
  document.querySelector(`.tool[data-tool="${tool}"]`).setAttribute('aria-expanded', 'true');
  const close = '<button class="btn px close" aria-label="Close">×</button>';
  if (tool === 'weather') {
    panel.innerHTML = `${close}<h2>Weather</h2>
      <div class="seg" role="group" aria-label="Units"><button class="btn px" data-u="F" aria-pressed="${state.unit === 'F'}">°F</button><button class="btn px" data-u="C" aria-pressed="${state.unit === 'C'}">°C</button></div>
      ${state.forecast.map((f, i) => `<div class="wxrow"><strong>${DAY_NAMES[i]}</strong><img class="px-img" src="${ART.wx[f.cond]}" alt="">
        <span>${COND_LABEL[f.cond]}</span><span>${temp(f.hi)} / ${temp(f.lo)}</span></div>`).join('')}
      <button class="btn px magic" id="wx-plan" style="margin-top:12px">Plan for this weather</button>
      <p class="fine">Sample forecast. Connect a weather API in getForecast().</p>`;
    panel.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { state.unit = b.dataset.u; renderBoard(); openTool = null; showPanel('weather'); });
    $('#wx-plan').onclick = () => replan('Planned for the weather.');
  }
  if (tool === 'style') {
    panel.innerHTML = `${close}<h2>Style</h2>
      <fieldset style="border:0;padding:0;margin:0"><legend class="sub">Vibe for the week</legend>
      ${Object.entries(VIBES).map(([k, v]) => `<label class="opt"><input type="radio" name="vibe" value="${k}" ${state.vibe === k ? 'checked' : ''}>${v.label}</label>`).join('')}</fieldset>
      <fieldset style="border:0;padding:0;margin:10px 0 0"><legend class="sub">Colors</legend>
      ${[['calm', 'Calm and neutral'], ['mix', 'A bit of both'], ['bold', 'Bright and bold']].map(([k, l]) => `<label class="opt"><input type="radio" name="mood" value="${k}" ${state.mood === k ? 'checked' : ''}>${l}</label>`).join('')}</fieldset>
      <button class="btn px magic" id="st-plan" style="margin-top:12px">Plan with this style</button>`;
    panel.querySelectorAll('input[name=vibe]').forEach(r => r.onchange = () => state.vibe = r.value);
    panel.querySelectorAll('input[name=mood]').forEach(r => r.onchange = () => state.mood = r.value);
    $('#st-plan').onclick = () => replan(`Planned a ${VIBES[state.vibe].label.toLowerCase()} week.`);
  }
  if (tool === 'filter') {
    panel.innerHTML = `${close}<h2>Filter closet</h2>
      ${CATS.map(c => `<label class="opt"><input type="checkbox" value="${c}" ${state.filter.has(c) ? 'checked' : ''}>${CAT_LABEL[c] === 'Undies' ? 'Underwear' : CAT_PLURAL[c][0].toUpperCase() + CAT_PLURAL[c].slice(1)}</label>`).join('')}
      <label class="opt" style="margin-top:8px"><input type="checkbox" id="fl-dirty" ${state.showDirty ? 'checked' : ''}>Show clothes in the hamper</label>
      <button class="btn px" id="fl-all" style="margin-top:8px">Show everything</button>`;
    panel.querySelectorAll('input[value]').forEach(cb => cb.onchange = () => { cb.checked ? state.filter.add(cb.value) : state.filter.delete(cb.value); renderCloset(); });
    $('#fl-dirty').onchange = e => { state.showDirty = e.target.checked; renderCloset(); };
    $('#fl-all').onclick = () => { state.filter = new Set(CATS); state.showDirty = false; renderCloset(); openTool = null; showPanel('filter'); };
  }
  if (tool === 'sort') {
    panel.innerHTML = `${close}<h2>Sort closet</h2>
      ${[['recent', 'Recently added'], ['type', 'Clothing type'], ['color', 'Color'], ['warmth', 'Warmest first'], ['planned', 'Most planned this week'], ['name', 'Name']]
        .map(([k, l]) => `<label class="opt"><input type="radio" name="sort" value="${k}" ${state.sort === k ? 'checked' : ''}>${l}</label>`).join('')}`;
    panel.querySelectorAll('input[name=sort]').forEach(r => r.onchange = () => { state.sort = r.value; renderCloset(); });
  }
  panel.querySelector('.close').onclick = closePanel;
  panel.classList.add('on');
  panel.querySelector('input, button:not(.close)')?.focus();
}
function replan(msg) {
  planWeek(); state.plan.forEach((p, d) => CATS.forEach(c => fresh.add(`${d}:${c}`)));
  renderAll(); toast(msg); burst(document.querySelector('.tool[data-tool="plan"]'), 10);
}
document.querySelectorAll('.tool').forEach(b => b.onclick = () => {
  const t = b.dataset.tool;
  if (t === 'plan') return replan('Week planned.');
  if (t === 'add') { closePanel(); return $('#file').click(); }
  showPanel(t);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openTool) closePanel(); });

/* ---------------- uploads ---------------- */
const GUESS_ORDER = ['tshirt', 'pants', 'hoodie', 'sneakers', 'longsleeve', 'shorts', 'cap'];
let guessIdx = 0;
function loadImg(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable')); }; img.src = url; });
}
function dominantColors(img) {
  const n = 48, c = document.createElement('canvas'); c.width = c.height = n;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, n, n);
  const d = ctx.getImageData(0, 0, n, n).data, px = [], border = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const i = (y * n + x) * 4, p = [d[i], d[i + 1], d[i + 2]];
    if (x < 3 || y < 3 || x >= n - 3 || y >= n - 3) border.push(p); else px.push(p); }
  const bg = [0, 1, 2].map(k => border.reduce((s, p) => s + p[k], 0) / border.length);
  const fg = px.filter(p => Math.hypot(p[0] - bg[0], p[1] - bg[1], p[2] - bg[2]) > 45);
  const pts = fg.length > 40 ? fg : px;
  let cent = [pts[0], pts[(pts.length / 2) | 0], pts[pts.length - 1]].map(p => [...p]);
  for (let it = 0; it < 10; it++) {
    const sums = cent.map(() => [0, 0, 0, 0]);
    pts.forEach(p => { let bi = 0, bd = 1e9; cent.forEach((c, i) => { const dd = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2; if (dd < bd) { bd = dd; bi = i; } });
      const s = sums[bi]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; });
    cent = sums.map((s, i) => s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3], s[3]] : [...cent[i].slice(0, 3), 0]);
  }
  cent.sort((a, b) => b[3] - a[3]);
  const out = [cent[0]];
  cent.slice(1).forEach(c => { if (c[3] / pts.length > .15 && out.every(o => Math.hypot(o[0] - c[0], o[1] - c[1], o[2] - c[2]) > 50)) out.push(c); });
  return out.map(c => rgbToHex(c.slice(0, 3)));
}
async function processFile(file) {
  if (API_BASE) {
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(`${API_BASE.replace(/\/$/, '')}/sprites`, { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `server said ${r.status}`);
    const j = await r.json();
    return makeItem({ name: j.name, subtype: TPL[j.subtype] ? j.subtype : 'tshirt', primary: j.colors.primary, secondary: j.colors.secondary,
      accent: j.colors.accent, pattern: j.pattern, graphic: j.graphic, letter: j.graphic_letter, warmth: j.warmth,
      formality: j.formality, tags: j.vibe_tags || [], src: 'upload', photo: j.cutout_png });
  }
  const { img, url } = await loadImg(file);
  const [primary, secondary] = dominantColors(img);
  const subtype = GUESS_ORDER[guessIdx++ % GUESS_ORDER.length];
  let base = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 24);
  base = base.charAt(0).toUpperCase() + base.slice(1);
  return makeItem({ name: base || SUBTYPE_LABEL[subtype], subtype, primary, secondary: secondary || null,
    warmth: { tshirt: 2, shorts: 1, hoodie: 4 }[subtype] || 3, src: 'upload', photo: url, guessed: true, tags: ['campus'] });
}
async function runUploads(files, { fromIntro } = {}) {
  files = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  if (!files.length) return toast('Pick image files: JPG, PNG, WEBP or HEIC.');
  const loader = $('#loader'); loader.classList.add('on');
  const sparkTimer = setInterval(() => burst($('#wand-img'), 3), 450);
  const added = [], failed = [];
  for (let i = 0; i < files.length; i++) {
    $('#loader-count').textContent = `${i + 1} of ${files.length}`;
    try { added.push(await processFile(files[i])); } catch (e) { failed.push(files[i].name); }
    if (!API_BASE) await wait(380);
  }
  clearInterval(sparkTimer);
  state.items.push(...added);
  CATS.filter(c => c !== 'hat').forEach(cat => {   // fill gaps so the week board isn't empty
    if (!state.items.some(i => i.cat === cat)) SAMPLE.filter(s => TPL[s[1]].cat === cat).slice(0, 4).forEach(s => state.items.push(sampleItem(s)));
  });
  loader.classList.remove('on');
  if (fromIntro) enterApp(); else { planWeek({ only: emptyDays() }); renderAll(); }
  const parts = [];
  if (added.length) parts.push(`Added ${added.length} item${added.length > 1 ? 's' : ''}.`);
  if (failed.length) parts.push(`Couldn’t read ${failed.join(', ')}. Try JPG or PNG.`);
  if (!API_BASE && added.length) parts.push('Tap any “?” item to fix its type.');
  toast(parts.join(' '), 5000);
}
const emptyDays = () => new Set(state.plan.map((p, d) => CATS.some(c => !p[c] && (c !== 'hat' || p.hatOn)) ? d : -1).filter(d => d >= 0));
$('#file').onchange = e => { const files = e.target.files; const intro = !$('#app').classList.contains('on');
  if (intro) introUpload(files); else runUploads(files); e.target.value = ''; };

/* ---------------- intro flow ---------------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let closetOpen = false;
$('#closet-btn').onclick = () => {
  if (closetOpen) return $('#file').click();
  closetOpen = true;
  const btn = $('#closet-btn');
  btn.classList.add('shake'); $('#closet-img').src = ART.closetOpen; burst(btn, 14);
  btn.setAttribute('aria-label', 'Upload photos of your clothes');
  setTimeout(() => {
    const cloud = $('#cloud'), demo = $('#demo-link');
    cloud.classList.add('show'); demo.classList.add('show');
    [cloud, demo].forEach(el => { el.tabIndex = 0; el.removeAttribute('aria-hidden'); });
    cloud.setAttribute('aria-label', 'Upload photos of your clothes');
    $('#hint').textContent = 'Add photos of your clothes, one item per photo';
    cloud.focus();
  }, reduced ? 0 : 320);
};
$('#cloud').onclick = () => $('#file').click();
['dragenter', 'dragover'].forEach(ev => $('#cloud').addEventListener(ev, e => { e.preventDefault(); $('#cloud').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('#cloud').addEventListener(ev, e => { e.preventDefault(); $('#cloud').classList.remove('over'); }));
$('#cloud').addEventListener('drop', e => introUpload(e.dataTransfer.files));
$('#demo-link').onclick = async () => { await poof(); SAMPLE.forEach(s => state.items.push(sampleItem(s))); await wandMoment(900); enterApp(); };

async function introUpload(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  if (!imgs.length) return toast('Pick image files: JPG, PNG, WEBP or HEIC.');
  if (!reduced) {
    const cr = $('#cloud').getBoundingClientRect(), cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    const flights = imgs.slice(0, 10).map((f, i) => {
      const el = document.createElement('img'); el.className = 'fly px-img';
      el.src = URL.createObjectURL(f); el.onerror = () => { el.removeAttribute('src'); };
      const ang = (i / Math.min(imgs.length, 10)) * Math.PI * 2, r = 260;
      const sx = cx + Math.cos(ang) * r - 32, sy = cy + Math.sin(ang) * r * .7 + 120 - 32;
      document.body.appendChild(el);
      return el.animate([{ transform: `translate(${sx}px, ${sy}px) scale(1)`, opacity: 1 },
        { transform: `translate(${cx - 32}px, ${cy - 32}px) scale(.15)`, opacity: .2 }],
        { duration: 700, delay: i * 90, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }).finished.then(() => el.remove());
    });
    await Promise.all(flights);
    $('#cloud').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18, .86)' }, { transform: 'scale(.94, 1.08)' }, { transform: 'scale(1)' }], { duration: 380 });
    puffs($('#cloud'), 8, 90); await wait(420);
  }
  await poof();
  await runUploads(imgs, { fromIntro: true });
}
async function poof() {
  const cloud = $('#cloud');
  if (!reduced) { puffs(cloud, 16, 180);
    await cloud.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.3)', opacity: 0 }], { duration: 320, fill: 'forwards' }).finished; }
  cloud.style.visibility = 'hidden';
}
async function wandMoment(ms) {
  $('#loader-count').textContent = ''; $('#loader-title').textContent = 'Setting up your closet';
  $('#loader').classList.add('on'); const t = setInterval(() => burst($('#wand-img'), 3), 300);
  await wait(reduced ? 200 : ms); clearInterval(t); $('#loader').classList.remove('on');
  $('#loader-title').textContent = 'Turning photos into pixels';
}
function enterApp() {
  $('#intro').classList.add('gone');
  setTimeout(() => $('#intro').remove(), 600);
  const app = $('#app'); app.classList.add('on'); requestAnimationFrame(() => app.classList.add('show'));
  $('#mode-pill').textContent = API_BASE ? 'Connected to sprite server' : 'Demo mode: types are guessed';
  if (!state.items.some(i => i.cat === 'hat')) state.plan.forEach(p => p.hatOn = false);
  planWeek(); renderAll();
}
function puffs(el, n, spread) {
  if (reduced) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'puff'; document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = spread * (.5 + Math.random() * .7), s = .6 + Math.random() * .9;
    p.animate([{ transform: `translate(${cx - 9}px, ${cy - 9}px) scale(${s})`, opacity: 1 },
      { transform: `translate(${cx - 9 + Math.cos(a) * d}px, ${cy - 9 + Math.sin(a) * d * .7}px) scale(${s * .3})`, opacity: 0 }],
      { duration: 520 + Math.random() * 200, easing: 'steps(6)' }).finished.then(() => p.remove());
  }
}
function burst(el, n) {
  if (reduced || !el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    s.style.left = (r.left + r.width * (.2 + Math.random() * .6)) + 'px'; s.style.top = (r.top + r.height * (.1 + Math.random() * .5)) + 'px';
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); s.style.setProperty('--dy', (Math.random() * -90 - 10) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}
let toastTimer;
function toast(msg, ms = 2800) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------------- boot ---------------- */
$('#hamper-drop').onclick = openHamper;
$('#wash-btn').onclick = () => { const d = state.items.filter(i => i.status === 'laundry').map(i => i.id); if (d.length) wash(d); };
(function boot() {
  ART.closetClosed = closetArt(false); ART.closetOpen = closetArt(true);
  ART.wx = Object.fromEntries(['sun', 'partly', 'cloud', 'rain'].map(k => [k, wxArt(k)]));
  ART.cat = Object.fromEntries(CATS.map(c => [c, spriteURL({ subtype: CAT_ICON[c], primary: '#8b9bb4', pattern: 'solid', seed: 'icon' })]));
  ART.lock = iconArt('lock'); ART.unlock = iconArt('unlock'); ART.nohat = iconArt('nohat');
  $('#closet-img').src = ART.closetClosed; $('#cloud-img').src = cloudArt(); $('#wand-img').src = wandArt();
  const rail = { weather: wxArt('partly'), style: iconArt('style'), plan: wandArt(), filter: iconArt('filter'), sort: iconArt('sort'), add: iconArt('add') };
  document.querySelectorAll('.tool').forEach(b => b.querySelector('img').src = rail[b.dataset.tool]);
  paintCanvas($('#logo'), textArt('Wardrobe Wizard'), 5);
  paintCanvas($('#logo-small'), textArt('Wardrobe Wizard'), 3);
  setupWeek();
})();
</script>
